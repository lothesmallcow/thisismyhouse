<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1e1e2e;
    color: #cdd6f4;
    font-family: system-ui, sans-serif;
  }
  h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: 2px; }
  #score { margin-bottom: 12px; font-size: 16px; }
  canvas {
    background: #11111b;
    border: 2px solid #45475a;
    border-radius: 4px;
  }
  #overlay {
    margin-top: 14px;
    font-size: 14px;
    color: #a6adc8;
    text-align: center;
    min-height: 20px;
  }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="score">Score: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="overlay">Use arrow keys or WASD to move &middot; Press Space to start</div>

<script>
(function () {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const overlayEl = document.getElementById("overlay");

  const CELL = 20;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;
  const STEP_MS = 100;

  let snake, dir, nextDir, food, score, running, timer;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    running = false;
    scoreEl.textContent = "Score: 0";
    overlayEl.textContent = "Use arrow keys or WASD to move · Press Space to start";
    placeFood();
    draw();
  }

  function placeFood() {
    while (true) {
      const fx = Math.floor(Math.random() * COLS);
      const fy = Math.floor(Math.random() * ROWS);
      if (!snake.some(s => s.x === fx && s.y === fy)) {
        food = { x: fx, y: fy };
        return;
      }
    }
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    const hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = "Score: " + score;
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.fillStyle = "#11111b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#f38ba8";
    ctx.fillRect(food.x * CELL, food.y * CELL, CELL - 1, CELL - 1);

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#a6e3a1" : "#94e2d5";
      ctx.fillRect(s.x * CELL, s.y * CELL, CELL - 1, CELL - 1);
    });
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    overlayEl.textContent = "Game over! Score: " + score + " · Press Space to play again";
  }

  function start() {
    if (running) return;
    reset();
    running = true;
    overlayEl.textContent = "";
    timer = setInterval(tick, STEP_MS);
  }

  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();

    if (k === " " || e.code === "Space") {
      e.preventDefault();
      if (!running) start();
      return;
    }

    let nd = null;
    if (k === "arrowup" || k === "w") nd = { x: 0, y: -1 };
    else if (k === "arrowdown" || k === "s") nd = { x: 0, y: 1 };
    else if (k === "arrowleft" || k === "a") nd = { x: -1, y: 0 };
    else if (k === "arrowright" || k === "d") nd = { x: 1, y: 0 };

    if (nd) {
      e.preventDefault();
      // Prevent reversing directly into the snake's body.
      if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
    }
  });

  reset();
})();
</script>
</body>
</html>
